tools:
  - id: python
    family: python-exact
    status: verified
    platform: windows
    route: native
    command:
      - python
    version_command:
      - python
      - --version
    smoke:
      command:
        - python
        - -c
        - print(2+2)
      expected_stdout_contains: "4"
      timeout_seconds: 30
    evidence_mode: exact-computation
    expensive: false
    licensed: false
    reproducibility_caveat: Prefer exact arithmetic and record package imports.

  - id: python-scientific-stack
    family: python-exact
    status: verified
    platform: windows
    route: native
    command:
      - python
    smoke:
      command:
        - python
        - -c
        - import sympy, numpy, scipy, networkx; print("scientific-stack-ok")
      expected_stdout_contains: scientific-stack-ok
      timeout_seconds: 30
    evidence_mode: exact-computation
    expensive: false
    licensed: false
    reproducibility_caveat: >
      Exact SymPy results may support claims; floating-point numpy or scipy
      results are numerical evidence unless independently bounded.

  - id: ipython-jupyter
    family: notebook
    status: verified
    platform: windows
    route: native
    command:
      - python
      - -m
      - jupyter
    version_command:
      - python
      - -m
      - jupyter
      - --version
    smoke:
      command:
        - python
        - -m
        - IPython
        - --version
      timeout_seconds: 30
    evidence_mode: finite-experiment
    expensive: false
    licensed: false
    reproducibility_caveat: >
      Notebooks are exploratory records until their reusable code and outputs
      are saved under experiments/.

  - id: matlab
    family: windows-cas
    status: verified
    platform: windows
    route: native
    command:
      - D:\matlab\bin\matlab.exe
    version_command:
      - D:\matlab\bin\matlab.exe
      - -batch
      - disp(version)
    smoke:
      command:
        - D:\matlab\bin\matlab.exe
        - -batch
        - disp(2+2)
      expected_stdout_contains: "4"
      timeout_seconds: 120
    evidence_mode: numerical-evidence
    expensive: true
    licensed: true
    reproducibility_caveat: MATLAB is licensed and heavy; prefer batch mode.

  - id: maple-cli
    family: windows-cas
    status: verified
    platform: windows
    route: native
    command:
      - D:\maple\bin.X86_64_WINDOWS\cmaple.exe
      - -q
    version_command:
      - D:\maple\bin.X86_64_WINDOWS\cmaple.exe
      - -q
    smoke:
      command:
        - D:\maple\bin.X86_64_WINDOWS\cmaple.exe
        - -q
      stdin: "2+2;\nquit;\n"
      expected_stdout_contains: "4"
      timeout_seconds: 60
    evidence_mode: exact-computation
    expensive: false
    licensed: true
    reproducibility_caveat: Maple output can support exact checks when scripts and assumptions are saved.

  - id: wolframscript
    family: windows-cas
    status: verified
    platform: windows
    route: native
    command:
      - C:\Program Files\Wolfram Research\WolframScript\wolframscript.exe
    version_command:
      - C:\Program Files\Wolfram Research\WolframScript\wolframscript.exe
      - -code
