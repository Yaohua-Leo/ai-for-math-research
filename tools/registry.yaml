    smoke:
      command:
        - C:\Program Files\Wolfram Research\WolframScript\wolframscript.exe
        - -code
        - 2+2
      expected_stdout_contains: "4"
      timeout_seconds: 60
    evidence_mode: exact-computation
    expensive: false
    licensed: true
    reproducibility_caveat: Use script mode and avoid storing Wolfram license data.

  - id: sagemath-wsl
    family: sage
    status: verified
    platform: wsl
    route: wsl-bash-lc
    command:
      - wsl.exe
      - -d
      - Ubuntu
      - --
      - bash
      - -lc
      - sage
    version_command:
      - wsl.exe
      - -d
      - Ubuntu
      - --
      - bash
      - -lc
      - sage --version
    smoke:
      command:
        - wsl.exe
        - -d
        - Ubuntu
        - --
        - bash
        - -lc
        - sage -c "print(2+2)"
      expected_stdout_contains: "4"
      timeout_seconds: 60
    evidence_mode: exact-computation
    expensive: false
    licensed: false
    reproducibility_caveat: Route one-liners through WSL bash -lc to avoid PowerShell quoting issues.

  - id: gap-sage
    family: sage
    status: verified
    platform: wsl
    route: sage-interface
    command:
      - wsl.exe
      - -d
      - Ubuntu
      - --
      - bash
      - -lc
      - sage
    smoke:
      command:
        - wsl.exe
        - -d
        - Ubuntu
        - --
        - bash
        - -lc
        - sage -c "from sage.interfaces.gap import gap; print(gap('2+2'))"
      expected_stdout_contains: "4"
      timeout_seconds: 60
    evidence_mode: exact-computation
    expensive: false
    licensed: false
    reproducibility_caveat: This is a Sage interface route, not a standalone GAP CLI.

