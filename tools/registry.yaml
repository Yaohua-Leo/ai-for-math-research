    smoke:
      command:
        - wsl.exe
        - -d
        - Ubuntu
        - --
        - bash
        - -lc
        - $HOME/.juliaup/bin/julia -e "using Oscar; println(2+2)"
      expected_stdout_contains: "4"
      timeout_seconds: 180
    evidence_mode: exact-computation
    expensive: true
    licensed: false
    reproducibility_caveat: OSCAR loads in WSL Julia; visualization warnings are not computation failures.

  - id: macaulay2-wsl
